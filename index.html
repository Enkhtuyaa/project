<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div class="Container">
      <div class="app-card" id="dashboardCard">
        <div class="spinner" id="loadingSpinner"></div>
        <div class="battery-container" id="batteryShell" style="display: flex">
          <div id="batteryTip"></div>
          <div class="battery-fill" id="batteryFill"></div>
        </div>
        <div class="percentage" id="percentageReadout" style="display: flex">
          --%
        </div>
        <div class="charging-indicator" id="chargingBadge">
          <svg width="14" height="14" viewBox="0 0 24 24" fil="currentColor">
            <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
          </svg>
          <span>Plugged In</span>
        </div>
        <div class="warning-message" style="display: none">
          API Not Supported
        </div>
        <div class="captain" id="captainText" style="display: flex">
          Reading device battery status...
        </div>
      </div>
    </div>
    <script src="/index.js"></script>
  </body>
</html>
