<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <script src="/index.js"></script>
    <header>
      <!-- Main Section -->
      <div class="Container">
        <div class="Main-card">
          <div id="big-box">
            <div id="box-gap">
              <div id="battery-box">
                <div class="battery-icon">
                  <div id="battery-inside">
                    <div class="battery-full"></div>
                  </div>
                </div>
                <div id="battery-tip"></div>
              </div>
              <div class="percentage-text">76%</div>
              <div class="battery-empty">--%</div>
            </div>
            <div class="charging-big">
              <div id="charging-box">
                <div id="icon-box">
                  <div class="charging-icon"></div>
                  <div class="charging">Charging</div>
                </div>
                <div class="empty-text">Connecting</div>
              </div>
              <div id="charging-text">
                <div id="Active-charging-text">
                  <p class="battery-text">Battery is charging</p>
                  <p class="battery-text">Estimated full: 42min</p>
                </div>
                <p class="empty-text1">Waiting for battery information...</p>
                <!-- <p class="battery-loading">Loading battery...</p> -->
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
